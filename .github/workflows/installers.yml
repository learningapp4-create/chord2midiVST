name: Installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build the VST3
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel 3
      - name: Package the disk image
        run: |
          set -euo pipefail
          VST3=$(find build -path '*VST3/Chord2MIDI.vst3' -type d | head -1)
          test -n "$VST3"
          test -d "$VST3/Contents"
          STAGE=$(mktemp -d)/Chord2MIDI
          mkdir -p "$STAGE"
          cp -R "$VST3" "$STAGE/Chord2MIDI.vst3"
          ln -s /Library/Audio/Plug-Ins/VST3 "$STAGE/VST3 Plug-Ins"
          printf '%s\n' \
            'Drag Chord2MIDI.vst3 onto "VST3 Plug-Ins".' \
            'That folder is /Library/Audio/Plug-Ins/VST3.' \
            'The plugin is unsigned. macOS may ask you to allow it in Privacy & Security.' \
            'JUCE is AGPLv3 unless you hold a commercial licence. The splash screen stays on.' \
            > "$STAGE/Install.txt"
          hdiutil create -volname "Chord2MIDI" -srcfolder "$STAGE" -ov -format UDZO "$RUNNER_TEMP/Chord2MIDI-mac.dmg"
          test -s "$RUNNER_TEMP/Chord2MIDI-mac.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Chord2MIDI-mac
          path: ${{ runner.temp }}/Chord2MIDI-mac.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build the VST3
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package the installer
        shell: pwsh
        run: |
          $vst = Get-ChildItem -Path build -Recurse -Directory -Filter 'Chord2MIDI.vst3' |
            Where-Object { $_.FullName -match 'VST3\\Chord2MIDI\.vst3$' } |
            Select-Object -First 1
          if (-not $vst) { throw 'VST3 bundle was not produced' }
          $stage = Join-Path $env:RUNNER_TEMP 'vst3'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse -Force $vst.FullName (Join-Path $stage 'Chord2MIDI.vst3')
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler was not found' }
          & $iscc "/DVst3Dir=$stage\Chord2MIDI.vst3" "$PWD\installers\windows.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'installers\output\Chord2MIDI-windows.exe')) { throw 'Installer exe was not produced' }
      - uses: actions/upload-artifact@v4
        with:
          name: Chord2MIDI-windows
          path: installers/output/Chord2MIDI-windows.exe
          if-no-files-found: error

  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DMG=$(find dist -name 'Chord2MIDI-mac.dmg' -type f | head -1)
          EXE=$(find dist -name 'Chord2MIDI-windows.exe' -type f | head -1)
          test -n "$DMG"
          test -n "$EXE"
          test "$(stat -c%s "$DMG")" -gt 1000000
          test "$(stat -c%s "$EXE")" -gt 1000000
          file "$DMG"
          file "$EXE"
          file "$EXE" | grep -E 'PE32|MS Windows|Install'
          mkdir -p publish
          cp "$DMG" publish/Chord2MIDI-mac.dmg
          cp "$EXE" publish/Chord2MIDI-windows.exe
          NOTES="Chord2MIDI 0.3.0 VST3 installers. Mac: open the disk image and drag Chord2MIDI.vst3 onto VST3 Plug-Ins (/Library/Audio/Plug-Ins/VST3). Windows: run the installer. It copies Chord2MIDI.vst3 to C:\Program Files\Common Files\VST3. Both builds are unsigned. JUCE is AGPLv3 in these binaries, and the splash screen stays on. Rescan plugins in the DAW after installing."
          if gh release view v0.3.0 >/dev/null 2>&1; then
            gh release upload v0.3.0 publish/Chord2MIDI-mac.dmg publish/Chord2MIDI-windows.exe --clobber
          else
            gh release create v0.3.0 publish/Chord2MIDI-mac.dmg publish/Chord2MIDI-windows.exe \
              --title "Chord2MIDI 0.3.0" \
              --notes "$NOTES"
          fi
